<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Recomendador de Autos 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            margin-top: 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.8em;
                flex-direction: column;
                gap: 5px;
            }

            .header p {
                font-size: 0.95em;
            }

            .header {
                padding: 25px 20px;
            }

            .content {
                padding: 25px 20px;
            }

            .recomendaciones {
                grid-template-columns: 1fr;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
            }

            .content {
                padding: 20px 15px;
            }

            input {
                padding: 10px 12px;
                font-size: 0.95em;
            }

            label {
                font-size: 1em;
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.show {
            display: block;
        }

        .perfil {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .perfil h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .perfil p {
            color: #666;
            line-height: 1.6;
        }

        .recomendaciones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recomendacion {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .recomendacion:hover {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
        }

        .recomendacion-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .recomendacion-header h3 {
            font-size: 1.5em;
            margin: 5px 0;
        }

        .recomendacion-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .recomendacion-body {
            padding: 20px;
        }

        .info-row {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
        }

        .info-value {
            color: #333;
        }

        .justificacion {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
            line-height: 1.5;
            color: #555;
            font-size: 0.95em;
        }

        .recomendacion-imagen {
            margin-top: 0;
            text-align: center;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .recomendacion-imagen svg {
            width: 100%;
            height: 200px;
            display: block;
        }

        .recomendacion-imagen img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c33;
            display: none;
        }

        .error.show {
            display: block;
        }

        .numero {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 Recomendador de Autos 2025</h1>
            <p>Encuentra tu auto perfecto basado en tu perfil</p>
        </div>

        <div class="content">
            <form id="formRecomendacion">
                <div class="form-row">
                    <div class="form-group">
                        <label for="profesion">👔 Profesión</label>
                        <input 
                            type="text" 
                            id="profesion" 
                            name="profesion" 
                            placeholder="ej: ingeniero, doctor, ejecutivo"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="personalidad">😊 Personalidad</label>
                        <input 
                            type="text" 
                            id="personalidad" 
                            name="personalidad" 
                            placeholder="ej: deportivo, familiar, elegante"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="hobby">🎯 Hobby/Afición</label>
                        <input 
                            type="text" 
                            id="hobby" 
                            name="hobby" 
                            placeholder="ej: tecnología, viajes, golf"
                            required
                        >
                    </div>
                </div>
                <button type="submit">Obtener Recomendaciones</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analizando opciones...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="results" id="results">
                <div class="perfil" id="perfilDiv"></div>
                <div class="recomendaciones" id="recomendacionesDiv"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('formRecomendacion');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const perfilDiv = document.getElementById('perfilDiv');
        const recomendacionesDiv = document.getElementById('recomendacionesDiv');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const profesion = document.getElementById('profesion').value.trim();
            const personalidad = document.getElementById('personalidad').value.trim();
            const hobby = document.getElementById('hobby').value.trim();

            if (!profesion || !personalidad || !hobby) {
                mostrarError('Por favor completa todos los campos');
                return;
            }

            loading.style.display = 'block';
            error.classList.remove('show');
            results.classList.remove('show');

            try {
                const response = await fetch('/api/recomendaciones', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        profesion,
                        personalidad,
                        hobby
                    })
                });

                const data = await response.json();

                if (data.exito) {
                    mostrarResultados(data);
                } else {
                    mostrarError(data.error || 'Error al obtener recomendaciones');
                }
            } catch (err) {
                mostrarError('Error de conexión: ' + err.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        function mostrarResultados(data) {
            // Mostrar perfil - usar 'contexto' si no hay 'perfil'
            const perfil = data.perfil || data.contexto;
            perfilDiv.innerHTML = `
                <h3>📋 Tu Perfil</h3>
                <p><strong>Profesión:</strong> ${perfil.profesion}</p>
                <p><strong>Personalidad:</strong> ${perfil.personalidad}</p>
                <p><strong>Hobby:</strong> ${perfil.hobby}</p>
            `;

            // Mostrar recomendaciones
            recomendacionesDiv.innerHTML = '';
            data.recomendaciones.forEach((rec, index) => {
                const div = document.createElement('div');
                div.className = 'recomendacion';
                
                // Extraer datos del auto
                const auto = rec.auto || rec;
                const imagen = rec.imagen || '';

                div.innerHTML = `
                    <div class="recomendacion-header">
                        <span class="numero">${index + 1}</span>
                        <h3>${auto.marca}</h3>
                        <p>${auto.modelo} ${auto.año || 2025}</p>
                    </div>
                    ${imagen ? `<div class="recomendacion-imagen"><img src="${imagen}" alt="${auto.marca} ${auto.modelo}"></div>` : ''}
                    <div class="recomendacion-body">
                        <div class="info-row">
                            <span class="info-label">Segmento:</span>
                            <span class="info-value">${auto.segmento || 'SUV'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Precio:</span>
                            <span class="info-value">${auto.precio || '$450,000 - $750,000'}</span>
                        </div>
                        <div class="justificacion">
                            ${rec.justificacion}
                        </div>
                    </div>
                `;
                recomendacionesDiv.appendChild(div);
            });

            results.classList.add('show');
        }

        function mostrarError(mensaje) {
            error.textContent = '❌ ' + mensaje;
            error.classList.add('show');
        }
    </script>

    <footer>
        Hecho por Abimelek Castrezana ❤️
    </footer>
</body>
</html>
